<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Personal Chess Trainer</title>

    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <main class="page-shell">

        <header class="topbar">
            <div>
                <h1>Personal Chess Trainer</h1>
                <p>Review missed winning opportunities from your own games.</p>
            </div>

            <div id="counter" class="counter-pill">
                Loading…
            </div>
        </header>


        <section class="trainer-card">

            <div class="position-header">

                <div>
                    <div class="category-label">
                        <span class="category-dot"></span>
                        <span id="category">Loading Position</span>
                    </div>

                    <h2 id="position-title">
                        Preparing training position…
                    </h2>
                </div>


                <div class="meta-group">
                    <span id="date-chip" class="meta-chip"></span>
                    <span id="color-chip" class="meta-chip"></span>
                    <span id="move-chip" class="meta-chip"></span>
                </div>

            </div>


            <div class="iframe-container">

                <div id="loading-message" class="loading-message">
                    Loading Lichess position…
                </div>

                <iframe
                    id="lichess-frame"
                    class="game-frame"
                    title="Lichess game position"
                    allowfullscreen
                ></iframe>

            </div>


            <div class="navigation-bar">

                <button
                    id="previous-button"
                    class="nav-button"
                    type="button"
                >
                    ← Previous
                </button>


                <div class="position-details">

                    <div id="evaluation" class="evaluation"></div>

                    <div id="move-detail" class="move-detail"></div>

                </div>


                <button
                    id="next-button"
                    class="nav-button"
                    type="button"
                >
                    Next →
                </button>

            </div>

        </section>


        <p class="footer-note">
            Use the left and right arrow keys to navigate.
        </p>

    </main>


    <script>
        const DATA_URL = "data/training_positions.json";

        let positions = [];
        let currentIndex = 0;


        const frame =
            document.getElementById("lichess-frame");

        const loadingMessage =
            document.getElementById("loading-message");

        const previousButton =
            document.getElementById("previous-button");

        const nextButton =
            document.getElementById("next-button");


        function formatCategory(category) {

            const labels = {
                missed_checkmate: "Missed Checkmate",
                blundered_win: "Blundered Win",
                squandered_advantage: "Squandered Advantage"
            };

            if (labels[category]) {
                return labels[category];
            }

            return String(category || "Training Position")
                .replaceAll("_", " ")
                .replace(
                    /\b\w/g,
                    letter => letter.toUpperCase()
                );
        }


        function buildPositionUrl(position) {

            if (position.position_url) {
                return position.position_url;
            }

            if (!position.site) {
                return null;
            }

            const baseUrl =
                position.site.split("#")[0];

            const moveNumber =
                Number(position.move_number);

            const color =
                String(position.user_color).toLowerCase();


            if (!moveNumber || !color) {
                return baseUrl;
            }


            let moveCount;

            if (color === "white") {
                moveCount =
                    (moveNumber - 1) * 2 - 1;
            }
            else {
                moveCount =
                    (moveNumber - 1) * 2;
            }


            return `${baseUrl}#${moveCount}`;
        }


        function getOpponent(position) {

            if (
                String(position.user_color).toLowerCase()
                === "white"
            ) {
                return position.black;
            }

            return position.white;
        }


        function showPosition(index) {

            if (!positions.length) {
                return;
            }


            currentIndex = index;

            const position =
                positions[currentIndex];

            const positionUrl =
                buildPositionUrl(position);

            const category =
                formatCategory(position.category);

            const opponent =
                getOpponent(position);


            document.getElementById(
                "counter"
            ).textContent =
                `${currentIndex + 1} of ${positions.length}`;


            document.getElementById(
                "category"
            ).textContent =
                category;


            document.getElementById(
                "position-title"
            ).textContent =
                opponent
                    ? `${category} vs. ${opponent}`
                    : category;


            document.getElementById(
                "date-chip"
            ).textContent =
                position.date || "Unknown date";


            document.getElementById(
                "color-chip"
            ).textContent =
                position.user_color
                    ? position.user_color[0].toUpperCase()
                        + position.user_color.slice(1)
                    : "";


            document.getElementById(
                "move-chip"
            ).textContent =
                position.move_number
                    ? `Move ${position.move_number}`
                    : "";


            document.getElementById(
                "evaluation"
            ).textContent =
                `${position.eval_before} → ${position.eval_after}`;


            document.getElementById(
                "move-detail"
            ).textContent =
                position.played_move_san
                && position.best_move_san
                    ? `Played ${position.played_move_san} · Best ${position.best_move_san}`
                    : "";


            previousButton.disabled =
                currentIndex === 0;

            nextButton.disabled =
                currentIndex === positions.length - 1;


            loadingMessage.classList.remove(
                "hidden"
            );


            if (positionUrl) {
                frame.src = positionUrl;
            }
        }


        async function loadPositions() {

            const response =
                await fetch(DATA_URL);

            if (!response.ok) {
                throw new Error(
                    `Unable to load ${DATA_URL}`
                );
            }

            const data =
                await response.json();

            positions =
                data.positions || [];

            if (!positions.length) {
                document.getElementById(
                    "position-title"
                ).textContent =
                    "No training positions found.";

                return;
            }

            showPosition(0);
        }


        previousButton.addEventListener(
            "click",
            () => {

                if (currentIndex > 0) {
                    showPosition(
                        currentIndex - 1
                    );
                }

            }
        );


        nextButton.addEventListener(
            "click",
            () => {

                if (
                    currentIndex
                    < positions.length - 1
                ) {
                    showPosition(
                        currentIndex + 1
                    );
                }

            }
        );


        document.addEventListener(
            "keydown",
            event => {

                if (
                    event.key === "ArrowLeft"
                    && currentIndex > 0
                ) {
                    showPosition(
                        currentIndex - 1
                    );
                }


                if (
                    event.key === "ArrowRight"
                    && currentIndex
                    < positions.length - 1
                ) {
                    showPosition(
                        currentIndex + 1
                    );
                }

            }
        );


        frame.addEventListener(
            "load",
            () => {
                loadingMessage.classList.add(
                    "hidden"
                );
            }
        );


        loadPositions();
    </script>

</body>
</html>
